name: '🚀 Release Plugin'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.4.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      numeric: ${{ steps.version.outputs.numeric }}
      md5: ${{ steps.checksums.outputs.md5 }}
      sha256: ${{ steps.checksums.outputs.sha256 }}

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Resolve and validate release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag '$TAG' (expected vX.Y.Z.W)."
            exit 1
          fi
          NUMERIC="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Verify tag points at the checked-out commit
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag $TAG points at $TAG_COMMIT but HEAD is $HEAD_COMMIT."
            exit 1
          fi

      - name: Restore locked NuGet dependencies
        run: dotnet restore Jellyfin.Plugin.DiscordRichPresence/Jellyfin.Plugin.DiscordRichPresence.csproj --locked-mode

      - name: Check for vulnerable dependencies
        run: |
          set -euo pipefail
          dotnet list Jellyfin.Plugin.DiscordRichPresence/Jellyfin.Plugin.DiscordRichPresence.csproj \
            package --vulnerable --include-transitive --format json > /tmp/vulnerabilities.json
          python - <<'PY'
          import json
          import sys

          with open('/tmp/vulnerabilities.json', encoding='utf-8') as handle:
              report = json.load(handle)

          findings = []
          for project in report.get('projects', []):
              for framework in project.get('frameworks', []):
                  for package in framework.get('topLevelPackages', []) + framework.get('transitivePackages', []):
                      if package.get('vulnerabilities'):
                          findings.append((project.get('path'), package.get('id'), package.get('resolvedVersion')))

          if findings:
              for path, package_id, version in findings:
                  print(f"::error::Vulnerable dependency {package_id} {version} in {path}")
              sys.exit(1)
          print('No vulnerable NuGet dependencies found.')
          PY

      - name: Build and package
        env:
          NUMERIC: ${{ steps.version.outputs.numeric }}
        run: python scripts/build.py --version "$NUMERIC"

      - name: Extract build checksums
        id: checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          with open('dist/release-metadata.json', encoding='utf-8') as handle:
              metadata = json.load(handle)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"md5={metadata['md5']}\n")
              out.write(f"sha256={metadata['sha256']}\n")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-asset
          path: |
            dist/jellyfin-discord-rich-presence.zip
            dist/release-metadata.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release & Update Manifest
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout main for manifest update
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-asset
          path: dist

      - name: Verify release tag is part of main
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist. Create the tag before running the release workflow."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not contained in main."
            exit 1
          fi

      - name: Publish release, verify remote asset, update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish_release.py --tag "$TAG" --repo "$REPO"

      - name: Verify manifest, release notes and remote asset
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: python scripts/verify_release.py --tag "$TAG" --zip dist/jellyfin-discord-rich-presence.zip --repo "$REPO"

      - name: Commit verified manifest.json
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: main
          commit_message: 'chore(release): update manifest.json for ${{ needs.build.outputs.tag }} [skip ci]'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          file_pattern: manifest.json
