name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and Package Plugin
        run: python scripts/build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jellyfin-discord-rich-presence.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Jellyfin Discord Rich Presence Plugin ${{ github.ref_name }}
            - Native C# .NET 8 plugin for Jellyfin 12.1+ and 10.9+
            - Built directly from tag `${{ github.ref_name }}`
          draft: false
          prerelease: false
